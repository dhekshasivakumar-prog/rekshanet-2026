<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citizen • RakshaNet</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head><body class="bg-[#f7f7f5] min-h-screen">
<nav class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b px-6 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-zinc-900 text-white grid place-items-center font-bold">R</div><b data-i18n="appName">RakshaNet</b><span data-i18n="citizen">Citizen</span><span class="ml-2 text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700" data-i18n="safeMode">SAFE MODE</span></div>
<div class="flex items-center gap-3"><div id="langContainer"></div><span id="userName" class="text-sm"></span><a href="login.html" class="text-xs px-3 py-1 rounded-full border" data-i18n="login">Login</a></div>
</nav>
<div id="alertBanner" class="hidden mx-4 mt-4 p-4 rounded-2xl bg-red-600 text-white flex justify-between items-center"><div><div class="font-bold" id="alertType">ALERT</div><div id="alertMsg" class="text-sm opacity-90"></div></div><button onclick="this.parentElement.classList.add('hidden')" class="text-white/70">✕</button></div>
<div class="grid lg:grid-cols-[1.2fr_0.8fr] gap-4 p-4 max-w-[1400px] mx-auto">
<div class="space-y-4">
<div class="rounded-[24px] overflow-hidden bg-white border shadow-sm">
<div class="p-4 flex justify-between"><h2 class="font-bold" data-i18n="liveMap">Live Safety Map</h2><div class="text-[10px] text-zinc-500">OpenStreetMap - No API Key</div></div>
<div id="map" class="h-[520px]"></div>
<div class="p-3 flex gap-2 text-[10px]"><span class="px-2 py-1 rounded-full bg-emerald-100" data-i18n="open">● Shelter Open</span><span class="px-2 py-1 rounded-full bg-red-100" data-i18n="hazard">● Hazard Zone</span><span class="px-2 py-1 rounded-full bg-blue-100" data-i18n="team">● NDRF Team</span></div>
</div>
<div class="rounded-[24px] bg-white border p-5 shadow-sm">
<h3 class="font-bold" data-i18n="checkin">I'm Safe Check-in</h3>
<div class="mt-3 grid grid-cols-3 gap-2">
<input id="cName" data-i18n-placeholder="yourName" placeholder="Your name" class="px-4 py-2.5 rounded-xl border bg-zinc-50">
<select id="cStatus" class="px-4 py-2.5 rounded-xl border bg-zinc-50"><option>Safe</option><option>Need Help</option><option>At Shelter</option></select>
<button id="checkinBtn" class="px-4 py-2.5 rounded-xl bg-zinc-900 text-white font-bold" data-i18n="send">Send ✓</button>
</div>
<div id="checkinList" class="mt-3 space-y-1 max-h-32 overflow-auto text-xs"></div>
</div>
</div>
<div class="space-y-4">
<div class="rounded-[24px] bg-zinc-900 text-white p-5"><h3 class="font-bold" data-i18n="nearest">Nearest Safe Places</h3><div id="shelterList" class="mt-4 space-y-3"></div></div>
<div class="rounded-[24px] bg-white border p-5"><h3 class="font-bold" data-i18n="history">Alert History</h3><div id="alertHistory" class="mt-3 space-y-2 max-h-[300px] overflow-auto"></div></div>
</div>
</div>
<script>
const socket=io();
const user=JSON.parse(localStorage.getItem('rakshanet_user')||'{"name":"Citizen"}');
document.getElementById('userName').textContent=user.name||user.username;
let map=L.map('map').setView([19.076,72.8777],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap - No API Key Needed'}).addTo(map);
let shelterLayer=L.layerGroup().addTo(map), hazardLayer=L.layerGroup().addTo(map), teamLayer=L.layerGroup().addTo(map);
let shelters=[];
async function loadData(){ const [sRes,aRes]=await Promise.all([fetch('/api/shelters'),fetch('/api/alerts')]); shelters=await sRes.json(); const alerts=await aRes.json(); renderShelters(shelters); renderAlerts(alerts); }
function renderShelters(list){ shelterLayer.clearLayers(); const html=document.getElementById('shelterList'); html.innerHTML=''; list.filter(s=>s.status==='open').slice(0,5).forEach(s=>{ const color='#10b981'; L.circleMarker([s.lat,s.lng],{radius:9,color,fillColor:color,fillOpacity:0.8}).addTo(shelterLayer).bindPopup(`<b>${s.name}</b><br>${s.capacity-s.occupied} spots free`); html.innerHTML+=`<div class='p-3 rounded-xl bg-white/10 border border-white/10 flex justify-between'><div><div class='font-bold text-sm'>${s.name}</div><div class='text-[11px] opacity-70'>${s.distanceKm||'~2.1'}km • ${s.capacity-s.occupied} free</div></div><a target='_blank' href='https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}' class='px-3 py-1 rounded-full bg-white text-black text-xs h-fit'>Go</a></div>`; }); }
function renderAlerts(alerts){ const cont=document.getElementById('alertHistory'); cont.innerHTML=alerts.map(a=>`<div class='p-3 rounded-xl border ${a.severity==='critical'?'bg-red-50 border-red-200':'bg-zinc-50'}'><div class='text-[10px] opacity-60'>${new Date(a.timestamp).toLocaleTimeString()} • ${a.type.toUpperCase()} • ${a.lang}</div><div class='text-xs mt-1 font-medium'>${a.message}</div></div>`).join(''); if(alerts[0]) showBanner(alerts[0]); }
function showBanner(a){ document.getElementById('alertBanner').classList.remove('hidden'); document.getElementById('alertType').textContent=a.type.toUpperCase()+' ALERT'; document.getElementById('alertMsg').textContent=a.message; }
socket.on('alerts:new', (alerts)=>{ fetch('/api/shelters').then(r=>r.json()).then(renderShelters); renderAlerts(alerts); });
socket.on('hazard:detected', h=>{ hazardLayer.clearLayers(); L.circle([h.lat,h.lng],{radius:8000,color:'#ef4444',fillOpacity:0.15}).addTo(hazardLayer); L.marker([h.lat,h.lng]).addTo(hazardLayer).bindPopup(`${h.type} at ${h.location}`).openPopup(); });
socket.on('resource:allocated', res=>{ if(res.shelters) renderShelters(res.shelters); });
socket.on('checkin:new', c=>{ document.getElementById('checkinList').innerHTML=`<div>✅ ${c.name} - ${c.status} at ${new Date(c.time).toLocaleTimeString()}</div>`+document.getElementById('checkinList').innerHTML; });
document.getElementById('checkinBtn').onclick=async()=>{ const name=document.getElementById('cName').value||user.name||'Anonymous'; const status=document.getElementById('cStatus').value; const body={name, status, lat:19.076, lng:72.8777, time:new Date()}; await fetch('/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); socket.emit('citizen:checkin', body); };
loadData();
</script>
</body></html>
